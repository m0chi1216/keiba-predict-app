name: Standalone tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.lock
      - run: python -m unittest apps.race_predict.test_app tests.test_standalone
      - run: docker build -t keiba-app:test .
      - run: docker run --rm keiba-app:test python -m unittest apps.race_predict.test_app tests.test_standalone
